<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TvCorp — Autenticação SaaS (E-mail ou Usuário)</title>
  
  <!-- Favicon Oficial TvCorp -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #0B0F19 !important;
      background: radial-gradient(circle at 10% 10%, #1A163B 0%, #070913 80%) !important;
      color: #FFFFFF !important;
      font-family: var(--font-main);
      overflow-x: hidden;
    }

    /* NAVBAR ALTO CONTRASTE */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 6%;
      background: rgba(11, 15, 25, 0.9) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: transform 0.25s ease;
    }
    .brand-logo:hover {
      transform: scale(1.03);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .nav-links a {
      color: #E2E8F0 !important;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s ease;
      text-decoration: none;
    }
    .nav-links a:hover {
      color: #FFC000 !important;
    }

    /* CONTAINER DO CARD */
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      z-index: 2;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 2.75rem 2.25rem;
      background: #111726 !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: 24px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.75);
      position: relative;
      z-index: 3;
    }

    .auth-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    .auth-header h1 {
      font-family: var(--font-heading);
      font-size: 2.1rem;
      font-weight: 800;
      color: #FFFFFF !important;
      margin-bottom: 6px;
    }
    .auth-header p {
      color: #94A3B8 !important;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #CBD5E1 !important;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-input-custom {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      background: #1A2337 !important;
      color: #FFFFFF !important;
      font-size: 0.98rem;
      font-weight: 500;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .form-input-custom::placeholder {
      color: #64748B !important;
      opacity: 1;
    }
    .form-input-custom:focus {
      outline: none;
      border-color: #7B61FF !important;
      background: #202B44 !important;
      box-shadow: 0 0 18px rgba(123, 97, 255, 0.45) !important;
    }

    .btn-submit-custom {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #7B61FF 0%, #E11D48 100%) !important;
      color: #FFFFFF !important;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 1.75rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(225, 29, 72, 0.4);
    }
    .btn-submit-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(225, 29, 72, 0.6);
      filter: brightness(1.15);
    }

    .alert-msg {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
      display: none;
    }
    .alert-msg.error {
      background: rgba(239, 68, 68, 0.22) !important;
      border: 1px solid #EF4444 !important;
      color: #FCA5A5 !important;
    }
    .alert-msg.success {
      background: rgba(16, 185, 129, 0.22) !important;
      border: 1px solid #10B981 !important;
      color: #6EE7B7 !important;
    }
  </style>
</head>
<body>

  <!-- NAVBAR PADRÃO HOME -->
  <nav class="navbar">
    <a href="index.html" class="brand-logo">
      <img src="assets/images/logo-full.svg" alt="TvCorp Logo" style="height: 38px; width: auto;">
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#recursos">Recursos</a></li>
      <li><a href="index.html#planos">Planos</a></li>
      <li><a href="help.html">Tutoriais & Ajuda</a></li>
      <li><a href="login.html" style="color: #fff;">Entrar</a></li>
      <li><a href="login.html?register=true" class="btn-primary" style="padding: 10px 20px; font-size: 0.85rem;">Testar 7 Dias Grátis 🚀</a></li>
    </ul>
  </nav>

  <!-- LUZES DE AMBIENTE -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="auth-container">
    <div class="auth-card fade-in">
      
      <!-- HEADER DO FORMULÁRIO -->
      <div class="auth-header">
        <a href="index.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 1.25rem; text-decoration: none;">
          <img src="assets/images/logo-full.svg" alt="TvCorp Logo" style="height: 48px; width: auto;">
        </a>
        <h1 id="formTitle">Entrar na sua conta</h1>
        <p id="formSubtitle">Acesse o painel do assinante TvCorp</p>
      </div>

    <!-- MENSAGEM DE ALERTA -->
    <div id="alertMsg" class="alert-msg"></div>

    <!-- FORMULÁRIO (SEM TIPO EMAIL NATIVO PARA PERMITIR LOGIN POR USUÁRIO) -->
    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      
      <!-- CAMPO NOME COMPLETO (REGISTRO) -->
      <div class="form-group" id="groupName" style="display: none;">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          NOME COMPLETO
        </label>
        <input type="text" id="inputName" class="form-input-custom" placeholder="Ex: Nome Nome">
      </div>

      <!-- CAMPO NOME DE USUÁRIO (REGISTRO) -->
      <div class="form-group" id="groupUsername" style="display: none;">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
          NOME DE USUÁRIO
        </label>
        <input type="text" id="inputUsername" class="form-input-custom" placeholder="Ex: nome_nome">
      </div>

      <!-- CAMPO PRINCIPAL: E-MAIL OU USERNAME (TIPO TEXT PARA NÃO BLOQUEAR NOME DE USUÁRIO) -->
      <div class="form-group">
        <label class="form-label" id="labelLoginInput">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          E-MAIL OU NOME DE USUÁRIO
        </label>
        <input type="text" id="inputEmail" class="form-input-custom" placeholder="Ex: usuario ou seuemail@empresa.com" required autocomplete="username">
      </div>

      <!-- CAMPO SENHA -->
      <div class="form-group">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          SENHA
        </label>
        <input type="password" id="inputPassword" class="form-input-custom" placeholder="••••••••" required minlength="6" autocomplete="current-password">
      </div>

      <!-- BOTÃO SUBMIT -->
      <button type="submit" id="btnSubmit" class="btn-submit-custom">
        Entrar no Painel ⚡
      </button>

      <!-- LINK ALTERNADOR -->
      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--text-muted);">
        <span id="footerQuestion">Ainda não tem conta?</span> 
        <a href="#" id="footerAction" style="color: var(--primary-cyan); font-weight: 700; text-decoration: none;" onclick="toggleAuthMode(event)">Criar conta</a>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">← Voltar para a Página Inicial</a>
    </div>
  </div>
</div>

  <script>
    let isRegisterMode = false;

    // Detectar parametro na URL ?register=true ou ?mode=register
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('register') === 'true' || params.get('mode') === 'register') {
        setAuthMode(true);
      } else {
        setAuthMode(false);
      }
    });

    function toggleAuthMode(e) {
      if (e) e.preventDefault();
      setAuthMode(!isRegisterMode);
    }

    function setAuthMode(register) {
      isRegisterMode = register;
      const formTitle = document.getElementById('formTitle');
      const formSubtitle = document.getElementById('formSubtitle');
      const groupName = document.getElementById('groupName');
      const groupUsername = document.getElementById('groupUsername');
      const labelLoginInput = document.getElementById('labelLoginInput');
      const inputEmail = document.getElementById('inputEmail');
      const btnSubmit = document.getElementById('btnSubmit');
      const footerQuestion = document.getElementById('footerQuestion');
      const footerAction = document.getElementById('footerAction');
      const alertMsg = document.getElementById('alertMsg');

      alertMsg.style.display = 'none';

      if (isRegisterMode) {
        formTitle.innerText = 'Criar sua conta';
        formSubtitle.innerText = 'Comece a criar sua TV Corporativa & Mídia Indoor hoje';
        groupName.style.display = 'block';
        groupUsername.style.display = 'block';
        labelLoginInput.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> E-MAIL`;
        inputEmail.placeholder = 'seuemail@empresa.com';
        btnSubmit.innerText = 'Criar Conta & Iniciar Teste 🚀';
        footerQuestion.innerText = 'Já possui conta?';
        footerAction.innerText = 'Faça login';
      } else {
        formTitle.innerText = 'Entrar na sua conta';
        formSubtitle.innerText = 'Acesse o painel do assinante TvCorp';
        groupName.style.display = 'none';
        groupUsername.style.display = 'none';
        labelLoginInput.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> E-MAIL OU NOME DE USUÁRIO`;
        inputEmail.placeholder = 'Ex: usuario ou seuemail@empresa.com';
        btnSubmit.innerText = 'Entrar no Painel ⚡';
        footerQuestion.innerText = 'Ainda não tem conta?';
        footerAction.innerText = 'Criar conta';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const alertMsg = document.getElementById('alertMsg');
      const btnSubmit = document.getElementById('btnSubmit');
      
      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPassword').value.trim();
      const name = document.getElementById('inputName').value.trim();
      const username = document.getElementById('inputUsername').value.trim();

      alertMsg.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Processando...';

      try {
        const action = isRegisterMode ? 'register' : 'login';
        const payload = isRegisterMode 
          ? { name, username, email, password } 
          : { email, password };

        const res = await fetch(`api/auth/${action}.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.success) {
          alertMsg.className = 'alert-msg success';
          alertMsg.innerText = isRegisterMode 
            ? 'Conta criada com sucesso! Ativando Trial de 7 Dias...' 
            : 'Autenticado com sucesso! Redirecionando...';
          alertMsg.style.display = 'block';

          localStorage.setItem('tvcorp_user', JSON.stringify(data.user));
          setTimeout(() => {
            window.location.href = 'app.html';
          }, 1000);

        } else {
          alertMsg.className = 'alert-msg error';
          alertMsg.innerText = data.error || 'Erro ao autenticar. Tente novamente.';
          alertMsg.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        alertMsg.className = 'alert-msg error';
        alertMsg.innerText = 'Erro de conexão com o servidor.';
        alertMsg.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = isRegisterMode ? 'Criar Conta & Iniciar Teste 🚀' : 'Entrar no Painel ⚡';
      }
    }
  </script>
</body>
</html>
