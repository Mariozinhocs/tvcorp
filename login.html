<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TvCorp — Criar sua Conta / Autenticação SaaS</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-gradient);
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 2.75rem 2.25rem;
      background: rgba(18, 16, 46, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-hover);
      border-radius: 24px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
    }
    .auth-header {
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-family: var(--font-heading);
      font-size: 2.1rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #8b8a9f;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-input-custom {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .form-input-custom:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .btn-submit-custom {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: #ffffff;
      color: #03020c;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 1.75rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
    }
    .btn-submit-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.25);
      background: #f0eeff;
    }

    .alert-msg {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
      text-align: center;
      display: none;
    }
    .alert-msg.error {
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid rgba(255, 59, 48, 0.3);
      color: #ff3b30;
    }
    .alert-msg.success {
      background: rgba(0, 255, 102, 0.15);
      border: 1px solid rgba(0, 255, 102, 0.3);
      color: #00ff66;
    }
  </style>
</head>
<body>

  <div class="auth-card fade-in">
    
    <!-- HEADER DO FORMULÁRIO (SCREENSHOT BENCHMARK) -->
    <div class="auth-header">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;">
        <span class="logo-dot"></span>
        <span class="gradient-text" style="font-family: var(--font-heading); font-weight: 800; font-size: 1.3rem;">TvCorp</span>
      </div>
      <h1 id="formTitle">Criar sua conta</h1>
      <p id="formSubtitle">Comece a criar sua TV Corporativa & Mídia Indoor hoje</p>
    </div>

    <!-- MENSAGEM DE ALERTA -->
    <div id="alertMsg" class="alert-msg"></div>

    <!-- FORMULÁRIO -->
    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      
      <!-- CAMPO NOME COMPLETO -->
      <div class="form-group" id="groupName">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          NOME COMPLETO
        </label>
        <input type="text" id="inputName" class="form-input-custom" placeholder="Ex: Nome Nome">
      </div>

      <!-- CAMPO NOME DE USUÁRIO -->
      <div class="form-group" id="groupUsername">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
          NOME DE USUÁRIO
        </label>
        <input type="text" id="inputUsername" class="form-input-custom" placeholder="Ex: nome_nome">
      </div>

      <!-- CAMPO E-MAIL -->
      <div class="form-group">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          E-MAIL
        </label>
        <input type="email" id="inputEmail" class="form-input-custom" placeholder="seuemail@empresa.com" required>
      </div>

      <!-- CAMPO SENHA -->
      <div class="form-group">
        <label class="form-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          SENHA
        </label>
        <input type="password" id="inputPassword" class="form-input-custom" placeholder="••••••••" required minlength="6">
      </div>

      <!-- BOTÃO SUBMIT -->
      <button type="submit" id="btnSubmit" class="btn-submit-custom">
        Criar Conta & Iniciar Teste 🚀
      </button>

      <!-- LINK ALTERNADOR -->
      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--text-muted);">
        <span id="footerQuestion">Já possui conta?</span> 
        <a href="#" id="footerAction" style="color: var(--primary-cyan); font-weight: 700; text-decoration: none;" onclick="toggleAuthMode(event)">Faça login</a>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">← Voltar para a Página Inicial</a>
    </div>
  </div>

  <script>
    let isRegisterMode = true;

    // Detectar parametro na URL ?mode=login ou ?register=true
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('mode') === 'login' || params.get('login') === 'true') {
        setAuthMode(false);
      } else {
        setAuthMode(true);
      }
    });

    function toggleAuthMode(e) {
      if (e) e.preventDefault();
      setAuthMode(!isRegisterMode);
    }

    function setAuthMode(register) {
      isRegisterMode = register;
      const formTitle = document.getElementById('formTitle');
      const formSubtitle = document.getElementById('formSubtitle');
      const groupName = document.getElementById('groupName');
      const groupUsername = document.getElementById('groupUsername');
      const btnSubmit = document.getElementById('btnSubmit');
      const footerQuestion = document.getElementById('footerQuestion');
      const footerAction = document.getElementById('footerAction');
      const alertMsg = document.getElementById('alertMsg');

      alertMsg.style.display = 'none';

      if (isRegisterMode) {
        formTitle.innerText = 'Criar sua conta';
        formSubtitle.innerText = 'Comece a criar sua TV Corporativa & Mídia Indoor hoje';
        groupName.style.display = 'block';
        groupUsername.style.display = 'block';
        btnSubmit.innerText = 'Criar Conta & Iniciar Teste 🚀';
        footerQuestion.innerText = 'Já possui conta?';
        footerAction.innerText = 'Faça login';
      } else {
        formTitle.innerText = 'Entrar na sua conta';
        formSubtitle.innerText = 'Acesse o painel do assinante TvCorp';
        groupName.style.display = 'none';
        groupUsername.style.display = 'none';
        btnSubmit.innerText = 'Entrar no Painel ⚡';
        footerQuestion.innerText = 'Ainda não tem conta?';
        footerAction.innerText = 'Criar conta';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const alertMsg = document.getElementById('alertMsg');
      const btnSubmit = document.getElementById('btnSubmit');
      
      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPassword').value.trim();
      const name = document.getElementById('inputName').value.trim();
      const username = document.getElementById('inputUsername').value.trim();

      alertMsg.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Processando...';

      try {
        const action = isRegisterMode ? 'register' : 'login';
        const payload = isRegisterMode 
          ? { name, username, email, password } 
          : { email, password };

        const res = await fetch(`api/auth/${action}.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.success) {
          alertMsg.className = 'alert-msg success';
          alertMsg.innerText = isRegisterMode 
            ? 'Conta criada com sucesso! Ativando Trial de 7 Dias...' 
            : 'Autenticado com sucesso! Redirecionando...';
          alertMsg.style.display = 'block';

          localStorage.setItem('tvcorp_user', JSON.stringify(data.user));
          setTimeout(() => {
            window.location.href = 'app.html';
          }, 1200);

        } else {
          alertMsg.className = 'alert-msg error';
          alertMsg.innerText = data.error || 'Erro ao autenticar. Tente novamente.';
          alertMsg.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        alertMsg.className = 'alert-msg error';
        alertMsg.innerText = 'Erro de conexão com o servidor.';
        alertMsg.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = isRegisterMode ? 'Criar Conta & Iniciar Teste 🚀' : 'Entrar no Painel ⚡';
      }
    }
  </script>
</body>
</html>
