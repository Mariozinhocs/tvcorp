<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tvPinkIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <g filter="url(#iconShadow)">
    <!-- Antennas -->
    <path d="M 40 18 L 60 36 L 80 18" fill="none" stroke="url(#tvPinkIcon)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- TV Body -->
    <rect x="18" y="34" width="84" height="70" rx="18" ry="18" fill="url(#tvPinkIcon)" />
    <!-- White Screen -->
    <rect x="28" y="44" width="64" height="50" rx="10" ry="10" fill="#FFFFFF" />
    <!-- Play Triangle -->
    <path d="M 52 56 L 72 69 L 52 82 Z" fill="url(#tvPinkIcon)" stroke-linejoin="round" />
  </g>
</svg>
